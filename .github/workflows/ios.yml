name: iOS CI

on:
  push:
    branches: [ IOS, main ]
  pull_request:
    branches: [ IOS, main ]

jobs:
  ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Cache Kotlin/Native compiler
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: ${{ runner.os }}-konan-${{ hashFiles('shared/build.gradle.kts') }}
        restore-keys: |
          ${{ runner.os }}-konan-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build shared framework for iOS device
      run: ./gradlew :shared:linkDebugFrameworkIosArm64

    - name: Archive iOS app
      run: |
        xcodebuild archive \
          -project iosApp/iosApp.xcodeproj \
          -scheme iosApp \
          -sdk iphoneos \
          -configuration Debug \
          -archivePath build/iosApp.xcarchive \
          CODE_SIGNING_ALLOWED=NO

    - name: Verify .app bundle contents
      run: |
        echo "=== App bundle structure ==="
        ls -la build/iosApp.xcarchive/Products/Applications/iosApp.app/
        echo "=== Frameworks directory ==="
        ls -la build/iosApp.xcarchive/Products/Applications/iosApp.app/Frameworks/ 2>/dev/null || echo "(no Frameworks dir - static linking)"
        echo "=== Binary size ==="
        ls -la build/iosApp.xcarchive/Products/Applications/iosApp.app/iosApp
        echo "=== Check for Kotlin symbols in binary ==="
        nm build/iosApp.xcarchive/Products/Applications/iosApp.app/iosApp 2>/dev/null | grep -i kfun | head -20 || echo "(no symbols found)"

    - name: Create IPA from xcarchive
      run: |
        mkdir -p build/ipa/Payload
        cp -R build/iosApp.xcarchive/Products/Applications/iosApp.app build/ipa/Payload/
        cd build/ipa && zip -qr ../iosApp.ipa Payload && cd ../..

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: iosApp.ipa
        path: build/iosApp.ipa
